name: Release

# Pushing a tag such as v0.1.0 runs every test and the installers on macOS,
# Linux and Windows, then publishes the package to PyPI. Publishing uses
# PyPI's trusted publishing: no password or token is stored anywhere.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/test.yml

  publish:
    needs: checks
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Build
        run: pipx run build --outdir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
