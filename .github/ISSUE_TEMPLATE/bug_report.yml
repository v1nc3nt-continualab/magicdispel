name: Bug report
description: A photo MagicDispel refused or cleaned wrongly, or anything else that went wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Please do not attach private photos.** Issues are public, and attachments can stay online even after an issue is deleted. Say where the photo comes from instead, or show the problem with a photo that contains nothing private, such as a picture of a blank wall.

        Did private data survive cleaning? That is a security issue: please [report it privately](https://github.com/v1nc3nt-continualab/magicdispel/security/advisories/new) instead.
  - type: textarea
    id: check
    attributes:
      label: Output of `magicdispel --check`
      description: It shows the version and whether ExifTool's second check is on. You may replace your user name in paths.
      render: text
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system
      placeholder: macOS 26, Windows 11, Ubuntu 24.04...
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Where the photo comes from
      description: The camera, phone or app that made it, and any app that edited it since.
      placeholder: iPhone 15 Pro, portrait mode HEIC, edited in Photos
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What MagicDispel printed
      description: The message, as it is. You may replace your user name and folder names in paths.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have not attached any photo, screenshot or file that shows or contains private information.
          required: true
